<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Nour — AI assistant</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0f172a"/>
    <stop offset="1" stop-color="#1e1b4b"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.82" cy="0.35" r="0.55">
    <stop offset="0" stop-color="#f59e0b" stop-opacity="0.35"/>
    <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
  </radialGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.07"/></pattern>
</defs>
<rect width="1280" height="320" rx="18" fill="url(#bg)"/>
<rect width="1280" height="320" rx="18" fill="url(#dots)"/>
<rect width="1280" height="320" rx="18" fill="url(#glow)"/>

<!-- light mark -->
<g transform="translate(1040,150)">
  <circle r="74" fill="none" stroke="#fbbf24" stroke-opacity="0.25" stroke-width="2"/>
  <circle r="52" fill="none" stroke="#fbbf24" stroke-opacity="0.45" stroke-width="2"/>
  <circle r="30" fill="#fbbf24"/>
  <text y="16" font-size="40" font-weight="700" fill="#1e1b4b" text-anchor="middle" direction="rtl">ن</text>
</g>

<text x="72" y="118" font-size="64" font-weight="800" fill="#ffffff">Nour <tspan fill="#fbbf24" direction="rtl">نور</tspan></text>
<text x="74" y="162" font-size="24" fill="#cbd5e1">AI assistant that answers from your documents,</text>
<text x="74" y="194" font-size="24" fill="#cbd5e1">reads your data and takes actions — in Arabic and English.</text>

<g font-size="15" font-weight="600">
  <rect x="74" y="230" width="68" height="32" rx="16" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2"/>
  <text x="108" y="251" fill="#e2e8f0" text-anchor="middle">RAG</text>
  <rect x="152" y="230" width="104" height="32" rx="16" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2"/>
  <text x="204" y="251" fill="#e2e8f0" text-anchor="middle">AI Agents</text>
  <rect x="266" y="230" width="64" height="32" rx="16" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2"/>
  <text x="298" y="251" fill="#e2e8f0" text-anchor="middle">n8n</text>
  <rect x="340" y="230" width="98" height="32" rx="16" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2"/>
  <text x="389" y="251" fill="#e2e8f0" text-anchor="middle">Telegram</text>
  <rect x="448" y="230" width="184" height="32" rx="16" fill="#fbbf24" fill-opacity="0.15" stroke="#fbbf24" stroke-opacity="0.5"/>
  <text x="540" y="251" fill="#fde68a" text-anchor="middle">Demo: HR assistant</text>
</g>
</svg>
