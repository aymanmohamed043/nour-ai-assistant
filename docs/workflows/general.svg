<svg xmlns="http://www.w3.org/2000/svg" width="695" height="287" viewBox="0 0 695 287" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>General — n8n workflow</title>
